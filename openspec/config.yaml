schema: spec-driven

# The project's rules are in CLAUDE.md (the only copy). Read it before writing any artifact.
context: |
  Fleet Command: a real-time tactical starship combat game in Godot 4.7 (GDScript), played from a
  console of panels beside a 3D view, on desktop and phones (a panel expands to full screen with the
  view at the side). CLAUDE.md is binding: write it up and mock it up in three.js before code, one
  implementation of every rule, a simulation that runs without a scene, tuning in data with units,
  fixed-size panels, no em or en dashes, every feature proven by a playtest.

rules:
  design:
    - State what it costs in plain numbers (triangles, draw calls, texture memory, CPU per step) on desktop and on phones
    - End with an "## Open questions" table whose ids also appear in docs/design/survey.html
  tasks:
    - Map every scenario to a headless test, a layout test or a playtest beat
