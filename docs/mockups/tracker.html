<title>Fleet Command Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the survey's chart-paper briefing, turned into a review board; one card per mockup with its two approvals. */
:root {
  --bg: #efe6d3; --paper: #f8f2e5; --ink: #2a2118; --muted: #6e5f4c; --line: #d8c9ac;
  --brass: #94621a; --brass-soft: #f0dfbd; --done: #3f7a3b; --done-soft: #dcebd5; --go: #2f5fae; --go-soft: #dbe5f5;
  --warn: #c23b30;
  --display: "Big Shoulders Stencil Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120d; --paper: #211a13; --ink: #ecdfc6; --muted: #a89577; --line: #3b2f22;
    --brass: #dcaa52; --brass-soft: #3a2b16; --done: #8cc47f; --done-soft: #1f3020; --go: #7fa6ec; --go-soft: #1b2638;
    --warn: #e0473d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17120d; --paper: #211a13; --ink: #ecdfc6; --muted: #a89577; --line: #3b2f22;
  --brass: #dcaa52; --brass-soft: #3a2b16; --done: #8cc47f; --done-soft: #1f3020; --go: #7fa6ec; --go-soft: #1b2638;
  --warn: #e0473d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 24px; }
header.top { padding-top: 28px; display: grid; gap: 10px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); }
h1 { font: 800 clamp(40px, 9vw, 64px)/0.92 var(--display); margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 64ch; }
.stages { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.stages li { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.chip { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; border-radius: 999px; padding: 5px 9px; border: 1px solid currentColor; white-space: nowrap; }
.chip.listed { color: var(--muted); }
.chip.drafted { color: var(--brass); }
.chip.build { color: var(--done); background: var(--done-soft); }
.chip.impl { color: var(--go); background: var(--go-soft); }
.notice { font-size: 14px; color: var(--muted); background: var(--brass-soft); border-radius: 8px; padding: 10px 12px; margin: 0; }
.list { display: grid; gap: 16px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.mid { font: 500 13px/1 var(--mono); color: var(--brass); border: 1px solid currentColor; border-radius: 6px; padding: 5px 7px; }
.card h2 { font: 800 28px/1 var(--display); margin: 0; flex: 1 1 200px; text-wrap: balance; }
.summary { margin: 0; max-width: 66ch; }
.meta { margin: 0; font: 500 12px/1.6 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
a.open, .toggle {
  font: 600 14px/1 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 0 14px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none;
}
a.open:hover, .toggle:hover:not(:disabled) { border-color: var(--brass); }
.toggle[aria-pressed="true"].b { background: var(--done-soft); border-color: var(--done); }
.toggle[aria-pressed="true"].i { background: var(--go-soft); border-color: var(--go); }
.toggle:disabled { opacity: 0.5; cursor: not-allowed; }
.toggle .box { width: 16px; height: 16px; border: 2px solid currentColor; border-radius: 4px; display: inline-grid; place-items: center; font-size: 12px; }
a.open:focus-visible, .toggle:focus-visible, textarea:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
label.note { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
textarea { font: 400 15px/1.45 var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 60px; resize: vertical; width: 100%; }
.status { font: 500 12px/1 var(--mono); color: var(--muted); min-height: 12px; }
.status.ok { color: var(--done); }
.status.err { color: var(--warn); }
code { font: 500 0.9em var(--mono); }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Fleet Command · mockup reviews</div>
    <h1>Mockup Tracker</h1>
    <p class="lede">Every mockup, its link and where it stands. A mockup is approved for build first, then for the game. Nothing goes into the game without both.</p>
    <ul class="stages" aria-label="Stages">
      <li><span class="chip listed">Listed</span></li>
      <li><span class="chip drafted">Drafted</span></li>
      <li><span class="chip build">Approved for build</span></li>
      <li><span class="chip impl">Approved for game</span></li>
    </ul>
    <p class="notice" id="mode" hidden></p>
  </header>
  <div class="list" id="list"></div>
</div>

<script>
// The mockups, in the order of mockup-work.md. Reviews live in the db collection `reviews`, one document per id.
const MOCKUPS = [
  { id: 'M1', title: 'Primary game flow', change: 'game-flow', page: 'docs/mockups/game-flow.html',
    url: 'https://claude.ai/artifact/FhyyMm5JL58SwRFAKRRBbk', published: '2026-10-30', version: 5,
    summary: 'Main menu, skirmish (scenario, point budget, fleet and loadout), the campaign hex map with standees, port panels and missions, deploy, a stand-in battle, results, and back to the map.' },
  { id: 'M2', title: 'In-game UI', change: 'battle-console', page: 'docs/mockups/battle-console.html',
    url: '', published: '', version: 0,
    summary: 'The battle console: ship systems on the left, the main panels, the ship overview panels and the 3D view with its targeting and shield display.' },
  { id: 'M3', title: 'Look dev', change: 'look-dev', page: 'docs/mockups/look-dev.html',
    url: '', published: '', version: 0,
    summary: 'Ship detail level, faction design language, destructible hulls and interiors, engines and effects, and hull lighting.' },
  { id: 'M4', title: 'Console skins', change: 'console-skins', page: 'docs/mockups/console-skins.html',
    url: 'https://claude.ai/artifact/PngN8P4W8RxrZeeZEda7GW', published: '2026-10-30', version: 9,
    summary: 'One UI kit, three design languages: Concord flat back-lit vector after LCARS with a Starfleet Command palette, Kethran modelled and rendered in Blender, the Vos hand-drawn. No two share a button, palette or icon shape.' },
];

const reviews = {}; // id -> { build, implementation, note }
const cards = {};
let db = null;
let canWrite = true;

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
}

function stageOf(m) {
  const r = reviews[m.id] ?? {};
  if (!m.url) return ['listed', 'Listed'];
  if (r.implementation) return ['impl', 'Approved for game'];
  if (r.build) return ['build', 'Approved for build'];
  return ['drafted', 'Drafted'];
}

function card(m) {
  const chip = el('span', { class: 'chip' });
  const status = el('div', { class: 'status', 'aria-live': 'polite' });
  const build = el('button', { class: 'toggle b', type: 'button', id: `build-${m.id}`, 'aria-pressed': 'false', onclick: () => toggle(m.id, 'build') },
    el('span', { class: 'box', 'aria-hidden': 'true' }), 'Approved for build');
  const impl = el('button', { class: 'toggle i', type: 'button', id: `impl-${m.id}`, 'aria-pressed': 'false', onclick: () => toggle(m.id, 'implementation') },
    el('span', { class: 'box', 'aria-hidden': 'true' }), 'Approved for game');
  const note = el('textarea', { id: `note-${m.id}`, rows: '2', placeholder: 'What to change, or why it is approved' });
  note.addEventListener('input', () => { reviews[m.id] = { ...(reviews[m.id] ?? {}), note: note.value }; queueSave(m.id); });
  note.addEventListener('blur', () => flush(m.id));
  const open = m.url
    ? el('a', { class: 'open', href: m.url, target: '_blank', rel: 'noopener' }, 'Open mockup')
    : el('span', { class: 'meta', text: 'Not built yet' });
  const meta = el('p', { class: 'meta', text: `OpenSpec: ${m.change}  ·  ${m.page}${m.published ? `  ·  published ${m.published}, v${m.version}` : ''}` });
  const root = el('article', { class: 'card', id: `card-${m.id}` },
    el('div', { class: 'head' }, el('span', { class: 'mid', text: m.id }), el('h2', { text: m.title }), chip),
    el('p', { class: 'summary', text: m.summary }), meta,
    el('div', { class: 'row' }, open, build, impl),
    el('label', { class: 'note', for: `note-${m.id}` }, 'Your notes', note), status);
  cards[m.id] = { root, chip, build, impl, note, status };
  return root;
}

function paint(id) {
  const m = MOCKUPS.find((x) => x.id === id);
  const c = cards[id];
  const r = reviews[id] ?? {};
  const [cls, label] = stageOf(m);
  c.chip.className = `chip ${cls}`;
  c.chip.textContent = label;
  c.build.setAttribute('aria-pressed', String(!!r.build));
  c.impl.setAttribute('aria-pressed', String(!!r.implementation));
  c.build.querySelector('.box').textContent = r.build ? '✓' : '';
  c.impl.querySelector('.box').textContent = r.implementation ? '✓' : '';
  c.build.disabled = !canWrite || !m.url;
  c.impl.disabled = !canWrite || !m.url || !r.build;
  c.note.disabled = !canWrite;
  if (document.activeElement !== c.note) c.note.value = r.note ?? '';
}

function setStatus(id, text, cls = '') {
  const s = cards[id].status;
  s.textContent = text;
  s.className = 'status ' + cls;
}

function toggle(id, key) {
  if (!canWrite) return;
  const r = { ...(reviews[id] ?? {}) };
  r[key] = !r[key];
  if (key === 'build' && !r.build) r.implementation = false; // the game approval rests on the build approval
  reviews[id] = r;
  paint(id);
  flush(id);
}

const timers = {};
const inflight = {};
function queueSave(id) {
  clearTimeout(timers[id]);
  setStatus(id, 'Editing…');
  timers[id] = setTimeout(() => flush(id), 900);
}

async function flush(id) {
  clearTimeout(timers[id]);
  if (!canWrite || !db) return;
  if (inflight[id]) { inflight[id].again = true; return; }
  const r = reviews[id] ?? {};
  const body = { build: !!r.build, implementation: !!r.implementation, note: r.note ?? '', updatedAt: new Date().toISOString() };
  inflight[id] = { again: false };
  setStatus(id, 'Saving…');
  try {
    await db.collection('reviews').doc(id).set(body);
    setStatus(id, 'Saved', 'ok');
  } catch (e) {
    setStatus(id, 'Not saved. Try again in a moment.', 'err');
  }
  const again = inflight[id].again;
  inflight[id] = null;
  if (again) flush(id);
}

function showMode(text) {
  const m = document.getElementById('mode');
  m.textContent = text;
  m.hidden = false;
}

async function connect() {
  if (!window.claude) {
    canWrite = false;
    MOCKUPS.forEach((m) => paint(m.id));
    showMode('This copy is open outside claude.ai, so approvals cannot be saved here.');
    return;
  }
  const [store, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!store) {
    canWrite = false;
    MOCKUPS.forEach((m) => paint(m.id));
    showMode('Reviews cannot be loaded here. Open the tracker on claude.ai while signed in.');
    return;
  }
  db = store;
  if (user && (await user.can('data.write')) === false) {
    canWrite = false;
    showMode('You can read this tracker, but only its owner can approve mockups.');
  }
  MOCKUPS.forEach((m) => paint(m.id));
  db.collection('reviews').onSnapshot((snap) => {
    for (const d of snap.docs) {
      if (!d.exists || !cards[d.id] || inflight[d.id] || document.activeElement === cards[d.id].note) continue;
      const b = d.data();
      reviews[d.id] = { build: !!b.build, implementation: !!b.implementation, note: typeof b.note === 'string' ? b.note : '' };
      paint(d.id);
    }
  }, () => showMode('Live updates stopped. Reload the page to see the latest reviews.'));
}

const list = document.getElementById('list');
MOCKUPS.forEach((m) => list.append(card(m)));
MOCKUPS.forEach((m) => paint(m.id));
connect();
</script>
