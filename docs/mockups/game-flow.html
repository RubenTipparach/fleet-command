/* Mockup 1 (OpenSpec change game-flow, mockup-work.md): the menus, skirmish setup, the campaign hex map, ports,
   missions and the way back, as one clickable prototype. Layout: a full-bleed 3D stage with the console's textured
   metal panels laid over it; on a phone a port panel takes the screen and the live map moves to a strip (CLAUDE.md 7).
   Deliberately one dark look: it is the game's own screen, so it does not follow the viewer's light theme. */
:root {
  color-scheme: dark;
  --bg: #04070b;
  --metal-hi: #36414e; --metal: #222a34; --metal-lo: #151b22; --edge: #0a0e13; --rim: #4a5767;
  --ink: #dbe6f1; --dim: #8b9cb0; --faint: #56667a;
  --lamp: #ffb547; --lamp-soft: rgba(255, 181, 71, 0.16);
  --ok: #62d08c; --warn: #ff6b5a;
  --concord: #4f8fe8; --kethran: #d9483b; --vos: #e3a33a; --neutral: #7c8794;
  --display: "Saira Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; z-index: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#ui { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#ui > * { pointer-events: auto; }
.badge { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: max(4px, env(safe-area-inset-top, 0px)); z-index: 3;
  font: 500 10px/1 var(--mono); letter-spacing: 0.1em; color: var(--faint); pointer-events: none; text-transform: uppercase; }

/* Textured console metal (survey U3): brushed plate, bevel, corner fixings. */
.panel {
  position: relative; border: 1px solid var(--edge); border-radius: 6px; color: var(--ink);
  background:
    radial-gradient(circle at 9px 9px, #8c97a4 0 1.6px, #20262e 2.2px, transparent 3px),
    radial-gradient(circle at calc(100% - 9px) 9px, #8c97a4 0 1.6px, #20262e 2.2px, transparent 3px),
    radial-gradient(circle at 9px calc(100% - 9px), #8c97a4 0 1.6px, #20262e 2.2px, transparent 3px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), #8c97a4 0 1.6px, #20262e 2.2px, transparent 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, var(--metal-hi), var(--metal) 38%, var(--metal-lo));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -2px 0 rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03), 0 10px 28px rgba(0,0,0,0.55);
  padding: 18px 20px;
}
.panel.inset { background: linear-gradient(180deg, #0c1117, #121921); box-shadow: inset 0 2px 6px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.04); border-color: #000; padding: 12px; }
.plate { font: 700 13px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.plate::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
h2 { font-size: 30px; font-weight: 800; line-height: 1; }
h3 { font-size: 19px; font-weight: 700; line-height: 1.1; }
p { margin: 0; }
.muted { color: var(--dim); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.col { display: grid; gap: 10px; align-content: start; min-width: 0; }
.spacer { flex: 1; }

/* Keycap buttons with a lamp. */
button { font: inherit; color: inherit; }
.key {
  min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 5px; cursor: pointer;
  font: 700 15px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink);
  border: 1px solid #05080b; background: linear-gradient(180deg, #3a4654, #263039);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -2px 0 rgba(0,0,0,0.4), 0 2px 0 #05080b;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: left;
}
.key:hover:not(:disabled) { background: linear-gradient(180deg, #45525f, #2c3742); }
.key:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 1px 0 #05080b; }
.key:focus-visible, .chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.key:disabled { opacity: 0.42; cursor: not-allowed; }
.key.go { background: linear-gradient(180deg, #e3a03c, #b8741c); color: #1a1006; }
.key.go:hover:not(:disabled) { background: linear-gradient(180deg, #f0b24f, #c98126); }
.key.danger { background: linear-gradient(180deg, #a6392f, #7a241d); }
.key.small { min-height: 36px; padding: 0 10px; font-size: 13px; }
.key.on { box-shadow: inset 0 0 0 2px var(--lamp), inset 0 0 14px var(--lamp-soft), 0 2px 0 #05080b; }
.key .lamp { width: 8px; height: 8px; border-radius: 50%; background: #3b2a12; box-shadow: inset 0 0 2px #000; flex: none; }
.key.on .lamp { background: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { min-height: 40px; padding: 0 12px; border-radius: 4px; cursor: pointer; border: 1px solid #05080b; background: #18202a; color: var(--dim);
  font: 600 13px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; }
.tab[aria-selected="true"] { color: var(--ink); background: #2b3644; box-shadow: inset 0 -3px 0 var(--lamp); }

/* Lists and bars. */
.list { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; min-height: 44px;
  border-radius: 4px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); cursor: pointer; text-align: left; width: 100%; }
.item:hover { border-color: rgba(255,181,71,0.45); }
.item[aria-selected="true"] { border-color: var(--lamp); background: var(--lamp-soft); }
.item .t { font: 700 17px/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.04em; }
.item .s { grid-column: 1 / -1; color: var(--dim); font-size: 13px; }
.item.off { opacity: 0.5; }
.bar { height: 8px; border-radius: 4px; background: #0a0f15; box-shadow: inset 0 1px 2px #000; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.bar.over i { background: var(--warn); }
.boxes { display: inline-flex; gap: 3px; }
.boxes button { width: 18px; height: 26px; border-radius: 2px; border: 1px solid #000; background: #1a222b; cursor: pointer; padding: 0; }
.boxes button.lit { background: var(--lamp); box-shadow: 0 0 6px var(--lamp-soft); }
table.grid { border-collapse: collapse; width: 100%; font-size: 14px; }
table.grid th { font: 600 12px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 6px 8px; }
table.grid td { padding: 6px 8px; border-top: 1px solid rgba(255,255,255,0.06); }
.scroll { overflow: auto; min-height: 0; }
.err { color: var(--warn); font-size: 13px; min-height: 18px; }
.chip { font: 500 11px/1 var(--mono); padding: 5px 8px; border-radius: 3px; background: #0d131a; border: 1px solid #2d3946; color: var(--dim); white-space: nowrap; }
.fac { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Screens. */
.menu { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); width: min(380px, calc(100% - 32px)); display: grid; gap: 18px; }
.title { font: 800 clamp(46px, 9vw, 86px)/0.84 var(--display); letter-spacing: 0.02em; text-transform: uppercase; text-shadow: 0 4px 24px rgba(0,0,0,0.8); }
.title small { display: block; font: 600 14px/1.4 var(--display); letter-spacing: 0.4em; color: var(--lamp); margin-top: 10px; }
.menu .key { width: 100%; justify-content: flex-start; min-height: 52px; font-size: 19px; }
.center { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; }
.center > * { pointer-events: auto; }
.sheet { width: min(560px, 100%); max-height: calc(100% - 24px); display: grid; gap: 14px; overflow: auto; }
.screen { position: absolute; inset: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 12px; grid-template-rows: auto 1fr auto; min-height: 0; }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between; }
.split { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); min-height: 0; align-items: start; }
.split > * { min-height: 0; max-height: 100%; }
.screen > * { width: 100%; max-width: 1360px; justify-self: center; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.map-preview { aspect-ratio: 16 / 10; width: 100%; border-radius: 4px; background: #070b10; display: block; }

/* Campaign map overlay. */
.topbar { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: max(10px, env(safe-area-inset-top, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 14px; }
.topbar .stat { display: grid; gap: 2px; }
.topbar .stat b { font: 600 11px/1 var(--display); letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; }
.topbar .stat span { font: 500 15px/1 var(--mono); }
.fleetchips { display: flex; gap: 6px; flex-wrap: wrap; }
.fleetchips .chip { display: inline-flex; gap: 6px; align-items: center; }
.hexpanel { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 88px; width: 330px; max-height: calc(100% - 170px); overflow: auto; display: grid; gap: 12px; }
.mapkeys { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; padding: 8px; }
.endturn { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.tip { position: fixed; z-index: 4; pointer-events: none; font: 600 13px/1.2 var(--display); letter-spacing: 0.06em; text-transform: uppercase;
  background: rgba(6,10,14,0.88); border: 1px solid #2c3845; padding: 6px 8px; border-radius: 3px; }

/* A port panel open: on desktop it sits on the left with the live map beside it; on a phone it takes the screen
   and the map moves to a strip on the right (landscape) or the bottom (portrait), survey U1 and U2. */
.portpanel { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  width: min(640px, calc(100% - 380px)); display: grid; grid-template-rows: auto 1fr auto; gap: 12px; min-height: 0; }
.strip-tag { display: none; }
@media (max-width: 920px), (max-height: 520px) {
  body.strip #stage { left: auto; width: 33.4vw; }
  body.strip .portpanel { width: auto; right: calc(33.4vw + 8px); }
  body.strip .strip-tag { display: block; position: fixed; right: 8px; bottom: 8px; z-index: 2; pointer-events: none; }
  body.strip .topbar, body.strip .mapkeys, body.strip .endturn { display: none; }
  .hexpanel { top: auto; bottom: 64px; right: max(8px, env(safe-area-inset-right, 0px)); width: min(330px, 46vw); max-height: 58%; padding: 12px; }
  .topbar { padding: 8px 10px; gap: 6px 12px; }
  .topbar .fleetchips, .topbar .stat.cap { display: none; }
  .split { grid-template-columns: 1fr; overflow: auto; }
  .screen { grid-template-rows: auto 1fr auto; }
  h2 { font-size: 24px; }
  .panel { padding: 14px; }
}
@media (orientation: portrait) and (max-width: 920px) {
  body.strip #stage { left: 0; width: 100%; top: auto; height: 36vh; }
  body.strip .portpanel { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(36vh + 8px); width: auto; }
  .hexpanel { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-height: 44%; bottom: 84px; }
  .menu { top: auto; bottom: 24px; transform: none; }
}
.loadout { display: grid; gap: 12px; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); min-height: 0; align-items: start; }
.loadout canvas { width: 100%; height: auto; aspect-ratio: 3 / 4; display: block; border-radius: 4px; background: #070b10; }
@media (max-width: 920px), (max-height: 520px) { .loadout { grid-template-columns: minmax(0, 220px) minmax(0, 1fr); } }
@media (max-width: 560px) { .loadout { grid-template-columns: 1fr; } .loadout canvas { max-width: 240px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

// ---------------------------------------------------------------------------------------------------------------
// Rules: plain functions on plain data, the same for skirmish and campaign (CLAUDE.md 6.1).
// ---------------------------------------------------------------------------------------------------------------
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let shipSerial = 0;
function newShip(hullId, name) {
  const h = HULLS[hullId];

function finishBattle(win) {
  const b = S.battle, R = rng(1000 + (CAMP?.battles ?? 0) * 17 + (win ? 1 : 0));
  if (CAMP) CAMP.battles++;
  const ships = b.fleet.map((s, i) => {
    const dmg = Math.floor((win ? 10 + R() * 35 : 35 + R() * 50));
    const hullPct = Math.max(0, s.hullPct - dmg);
    return { s, name: s.name, hullPct, lost: !win && i > 0 && hullPct < 20 };
  });
  const r = { kind: b.kind, name: b.name, win, ships, reward: 0, prize: null };
  if (b.kind === 'campaign') {
    for (const x of ships) x.s.hullPct = x.hullPct;
    CAMP.fleet = CAMP.fleet.filter((s) => !ships.find((x) => x.s === s && x.lost));
    if (win) {
      r.reward = b.mission.reward; CAMP.credits += r.reward;
      if (b.mission.type === 'capture' && CAMP.fleet.length < FLEET_MAX) { const p = newShip('swift', 'Prize Ship Varn'); p.hullPct = 40; CAMP.fleet.push(p); r.prize = p.name; }
    }
    CAMP.missions = CAMP.missions.filter((m) => m !== b.mission);
  }
  go('results', { result: r });
}

// Named shots for tools/mockups/shoot.mjs: each sets up one screen from a fresh state.
function freshCampaign() { S.camp = { name: 'Captain Ardent', diff: 1 }; startCampaign(); }
window.MOCKUP_SHOTS = {
  menu: () => go('menu', { quit: false, closed: false }),
  options: () => go('options'),
  quit: () => go('menu', { quit: true, closed: false }),
  skirmish: () => { S.sk = { scen: 1, scale: 1, fleet: [], sel: 0 }; go('skirmish'); },
  fleet: () => { S.sk = { scen: 1, scale: 1, fleet: [newShip('halberd', 'CNS Resolute'), newShip('swift', 'CNS Wren')], sel: 0 }; S.sk.fleet[1].behaviour = 'Attack my target'; go('fleet'); },
  fleet_over: () => { S.sk = { scen: 0, scale: 0, fleet: [newShip('bastion', 'CNS Resolute'), newShip('lantern', 'CNS Wren')], sel: 0 }; go('fleet'); },
  loadout: () => { S.sk = { scen: 3, scale: 1, fleet: [newShip('bastion', 'CNS Resolute'), newShip('lantern', 'CNS Wren')], sel: 0 }; S.lo.group = 'primary'; openLoadout(S.sk.fleet[0], 'fleet', skirmishPurse()); S.lo.hp = 1; S.lo.sys = 'lance'; render(); },
  battle: () => { S.sk = { scen: 1, scale: 1, fleet: [newShip('halberd', 'CNS Resolute'), newShip('swift', 'CNS Wren')], sel: 0 }; CAMP = null; startBattle({ kind: 'skirmish', name: 'Convoy Raid', fleet: S.sk.fleet, enemy: 'vos', enemyCount: 5 }); },
  skirmish_results: () => { MOCKUP_SHOTS.battle(); finishBattle(true); },
  new_campaign: () => go('newcamp'),
  map: () => { freshCampaign(); },
  map_far: () => { freshCampaign(); setZoom(36); },
  map_near: () => { freshCampaign(); centreOn(4, 4, 9); },
  map_path: () => { freshCampaign(); selectHex(4, 3); },
  shipyard: () => { freshCampaign(); openPort('shipyard'); },
  outfitter: () => { freshCampaign(); openPort('outfitter'); },
  outfitter_refit: () => { freshCampaign(); S.lo.group = 'heavy'; openLoadout(CAMP.fleet[0], 'map', campaignPurse()); S.lo.sys = 'torpedo'; render(); },
  recruiting: () => { freshCampaign(); openPort('recruit'); },
  briefing: () => { freshCampaign(); const m = CAMP.missions.find((x) => x.type === 'patrol') || offerMission('patrol'); rebuildMarkers(); CAMP.at = { c: m.c, r: m.r }; buildMap(); centreOn(m.c, m.r, 14); selectHex(m.c, m.r); briefing(m); },
  campaign_results: () => { MOCKUP_SHOTS.briefing(); const m = S.mission; startBattle({ kind: 'campaign', name: MISSIONS[m.type].name, fleet: CAMP.fleet, enemy: 'kethran', enemyCount: 2, mission: m }); finishBattle(true); },
};
window.MOCKUP_SCENE = mapScene;

render();
resize();
window.MOCKUP_READY = true;
</script>
