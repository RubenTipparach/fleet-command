<!doctype html>
<!--
  Fleet Command mockup page skeleton (threejs-mockups skill). Copy it to docs/mockups/<subject>.html,
  name the OpenSpec change it presents in the title block, and replace build() with the subject.

  Contract with tools/mockups/shoot.mjs:
    window.MOCKUP_SHOTS = { name: () => { ...set the view... } }   every named shot
    window.MOCKUP_READY = true                                       once the scene is built
    window.MOCKUP_SCENE = scene                                      for geometry checks
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Template</title>
<style>
  :root {
    --bg: #05070b; --panel: #0d1622; --edge: #2c4a6b; --ink: #cfe3ff; --dim: #6f8bab; --accent: #49d17d;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 "Rajdhani", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; }
  .title { position: fixed; left: 16px; top: 12px; max-width: min(520px, calc(100% - 32px));
    background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--edge);
    padding: 8px 12px; border-radius: 4px; }
  .title h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: .06em; text-transform: uppercase; }
  .title p { margin: 0; color: var(--dim); }
  .meter { position: fixed; right: 16px; bottom: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .views { position: fixed; left: 16px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .views button { min-width: 44px; min-height: 44px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 4px; font: inherit; text-transform: uppercase; padding: 0 12px; }
  .views button:hover { border-color: var(--accent); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="title">
  <h1>Subject</h1>
  <p>OpenSpec change: <code>name</code>. Drag to orbit, scroll or pinch to zoom.</p>
</div>
<div class="views" id="views"></div>
<div class="meter" id="meter"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0x8fb0ff, 0x101018, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(300, 400, 200);
scene.add(key);

// Yardstick: a 10 m grid and a 1.8 m figure, so every subject is seen at true scale (Mining Mike's rule).
const grid = new THREE.GridHelper(400, 40, 0x2c4a6b, 0x16263a);
scene.add(grid);
const person = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 1.3, 4, 8), new THREE.MeshStandardMaterial({ color: 0xffcc66 }));
person.position.set(0, 0.9, 0);
scene.add(person);

function build() {
  // The subject goes here. Read shapes and sizes from one data file; never hand-place twice.
  const hull = new THREE.Mesh(new THREE.BoxGeometry(60, 12, 140), new THREE.MeshStandardMaterial({ color: 0x8a96a8, metalness: 0.6, roughness: 0.45 }));
  hull.position.y = 30;
  scene.add(hull);
  return hull;
}
const subject = build();

const VIEWS = {
  three_quarter: () => { camera.position.set(180, 120, 220); controls.target.set(0, 30, 0); },
  top: () => { camera.position.set(0, 420, 0.01); controls.target.set(0, 30, 0); },
  side: () => { camera.position.set(320, 30, 0); controls.target.set(0, 30, 0); },
};
const bar = document.getElementById('views');
for (const [name, set] of Object.entries(VIEWS)) {
  const b = document.createElement('button');
  b.textContent = name.replace('_', ' ');
  b.onclick = set;
  bar.append(b);
}
VIEWS.three_quarter();

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const meter = document.getElementById('meter');
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  meter.textContent = `${renderer.info.render.triangles.toLocaleString()} tris, ${renderer.info.render.calls} draws`;
});

window.MOCKUP_SCENE = scene;
window.MOCKUP_SHOTS = VIEWS;
window.MOCKUP_READY = true;
</script>
</body>
</html>
