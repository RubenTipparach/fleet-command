<script type="application/json" data-src="data/space/starfield.json">{"schema":"starcrew.starfield/1","_status":"Built (2026-10-16): openspec/changes/nebula-skies design 5, docs/mockups/nebula-skies.html. Read by tools/space/nebula_skies.py (the classes and colours), the mockup and sc-core::sky (the engine's stars and streaks).","_doc":"The vector stars drawn over a nebula sky, and how they streak (nebula-skies design 5). Each star is a direction at infinity; every frame it is drawn as a line from where it is on screen now back toward where it was tail_s ago, so a turning view smears the stars into short lines (FreeSpace's way: the star's last position kept, a line drawn to it, its length capped and its brightness dimmed as it grows). A star's class sets its brightness range (the sky file holds each star's own) and its head's size at rest; its colour is a tint. streak: tail_s the seconds of turning a tail shows, max_deg the longest tail (angle), min_px the least line drawn (a star at rest is a point), dim_per_deg the brightness lost per degree of tail (FreeSpace 2's 7,800 per unit) and dim_floor the least kept (FreeSpace 2 kept 75 of 255 over black space; 0.5 here so a streak still reads over a bright cloud), tail_fade the tail end's share of the head's opacity, alpha_min and whiten: a star is alpha-blended (FreeSpace's alpha-blended lines) toward its colour mixed whiten of the way to white, at an opacity of alpha_min + (1 - alpha_min) x its brightness, times the dim, cut_deg_s a turn faster than this is a camera cut (no tail that frame), faint_floor the faint hashed stars' brightness while the tail is at its cap (design 5.5: they fade during a fast turn). motes: patrol-mission 11.4's dust round the eye, drawn by the same streak rule from eye-space points, so moving forward fast shows. Colours sRGB 0-1.","_owner":"2026-10-15: \"and drawing stars and simulating motion blur with gl lines\", \"like old school games\", \"freespace 1 did fake motion blur with vector graphics stars\"","classes":[{"name":"faint","share":0.56,"brightness":[0.1,0.28],"size_px":1.0},{"name":"plain","share":0.29,"brightness":[0.28,0.52],"size_px":1.0},{"name":"bright","share":0.12,"brightness":[0.52,0.82],"size_px":2.0},{"name":"brilliant","share":0.03,"brightness":[0.82,1.0],"size_px":3.0}],"colours":[{"name":"blue-white","share":0.16,"srgb":[0.74,0.84,1.0]},{"name":"white","share":0.34,"srgb":[1.0,1.0,1.0]},{"name":"cream","share":0.28,"srgb":[1.0,0.95,0.85]},{"name":"gold","share":0.15,"srgb":[1.0,0.85,0.62]},{"name":"red","share":0.07,"srgb":[1.0,0.7,0.56]}],"streak":{"tail_s":0.025,"max_deg":1.7,"min_px":1.0,"dim_per_deg":0.534,"dim_floor":0.5,"tail_fade":0.45,"alpha_min":0.3,"whiten":0.4,"cut_deg_s":720,"faint_floor":0.3},"motes":{"count":200,"cube_m":300,"tail_s":0.033,"fade_from_m":150,"brightness":0.35}}</script>

  'frame.panel': { size: [160, 120], m: [22, 28, 22, 44], draw: (x, w, h) => ccSweep(x, 0, 0, w, h, { bar: 28, arm: 10, R: 24, r: 10, cap: 16, col: CC.signal, capCol: CC.sky }) },

  'bar.track': { size: [96, 16], m: [0, 10, 0, 10], inset: [3, 3], draw: (x, w, h) => { x.fillStyle = CC.deep; rr(x, 0, 0, w, h, 8); x.fill(); x.fillStyle = '#000'; rr(x, 2, 2, w - 4, h - 4, 6); x.fill(); } },
  'bar.fill': { size: [64, 10], m: [0, 6, 0, 6], draw: (x, w, h) => { x.fillStyle = CC.sky; rr(x, 0, 0, w, h, 5); x.fill(); } },
  'bar.fill.red': { size: [64, 10], m: [0, 6, 0, 6], draw: (x, w, h) => { x.fillStyle = CC.alert; rr(x, 0, 0, w, h, 5); x.fill(); } },
  // The pill: round caps both ends (LCARS's button). Labels black, right-aligned, as on a back-lit panel.

// CLAUDE.md section 7 ("allocation is discrete boxes"), in four states. Concord: a small flat pill, lit from behind.
const ccCells = {
  'cell.idle': { size: [32, 28], m: [10, 10, 10, 10], draw: (x, w, h) => { x.fillStyle = CC.deep; rr(x, 0, 0, w, h, 8); x.fill(); } },
  'cell.lit': { size: [32, 28], m: [10, 10, 10, 10], draw: (x, w, h) => { x.fillStyle = CC.sky; rr(x, 0, 0, w, h, 8); x.fill(); } },
  'cell.warn': { size: [32, 28], m: [10, 10, 10, 10], draw: (x, w, h) => { x.fillStyle = CC.alert; rr(x, 0, 0, w, h, 8); x.fill(); } },
  'bar.fill.accord': { size: [64, 10], m: [0, 6, 0, 6], draw: (x, w, h) => { x.fillStyle = CC.accord; rr(x, 0, 0, w, h, 5); x.fill(); } },

  'cell.locked': { size: [32, 28], m: [10, 10, 10, 10], draw: (x, w, h) => { x.strokeStyle = CC.deep; x.lineWidth = 2; rr(x, 1, 1, w - 2, h - 2, 7); x.stroke(); } },

  // A tall block at the left, rounded on its outer side, sweeping into a thin bar along one edge with a cap at the end.
  x.save(); if (flip) { x.translate(0, h); x.scale(1, -1); }

const concordHero = {
  'nameplate': (x, w, h) => {
    x.fillStyle = CC.signal; rr(x, 0, 0, 96, h, [28, 4, 4, 28]); x.fill();
    x.fillStyle = CC.deep; rr(x, 102, h - 10, w - 140, 8, 4); x.fill();

    x.fillStyle = '#000'; for (const a of [0, P / 2, P, 1.5 * P]) { x.save(); x.translate(c, c); x.rotate(a); x.fillRect(136, -6, 10, 12); x.restore(); }

  // The systems display: two sweeps facing each other, thick on the left, thinner on the right.
  'ssd.bezel': (x, w, h) => {

<script data-src="docs/mockups/lib/space.js">
// Fleet Command mockups: the space backdrop and the stand-in ship, shared by every page that shows space
// (docs/mockups/game-flow.html, docs/mockups/battle-console.html). One implementation (CLAUDE.md section 6.1): edit it
// here, then re-run tools/mockups/inline_data.py on each page that inlines it.
//
// FCSpace(THREE, renderer, DATA, rng) returns { makeSpace, parallaxStars, shipModel, nebulaMesh }. DATA maps a data file's path to
// its parsed JSON (the page's inlined data/space/ files); rng(seed) is the page's seeded generator.
//

// Space backdrop, ported from Star Crew Bridge Simulator (RubenTipparach/Star-Crew-Bridge-Simulator 9a35f08:
// crates/sc-render/shaders/sky.glsl and docs/mockups/nebula-skies.html) at the owner's request (2026-10-30: "Star crew
// bridge simulator! also borrow its star shader from there too, so when we scroll around the stars trace an outline").
// Three layers:
// - the nebula: a sky file's vertex-coloured sphere (data/space/skies/, inlined below by tools/mockups/inline_data.py)
//   with the faint hashed stars, hidden where the nebula is dense, and an ordered dither so slow gradients never band;
// - the vector stars: FreeSpace's lines, each drawn from where it is on screen back toward where it was tail_s ago,
//   capped and dimmed as it grows, alpha-blended and whitened as it streaks (data/space/starfield.json's rule);
// - parallax stars below the board: the same lines for points at a finite depth, so panning the map, which turns
//   nothing, still streaks them, the nearer ones sliding and streaking more.
window.FCSpace = function FCSpace(THREE, renderer, DATA, rng) {
'use strict';
const SF = DATA['data/space/starfield.json'];
function bytesOf(rows) {
  const parts = rows.map((r) => Uint8Array.from(atob(r), (c) => c.charCodeAt(0)));

  let o = 0; for (const q of parts) { out.set(q, o); o += q.length; }
  return out;
}
function skyGeometry(S) {
  // 8 bytes a vertex: octahedral direction (two 16-bit), sRGB colour, the share of the stars behind it hidden.
  const vb = bytesOf(S.mesh.vertices_b64), n = vb.length / 8;
  const pos = new Float32Array(n * 3), col = new Uint8Array(n * 4);
  for (let i = 0; i < n; i++) {
    const px = (vb[8 * i] | (vb[8 * i + 1] << 8)) / 65535 * 2 - 1, py = (vb[8 * i + 2] | (vb[8 * i + 3] << 8)) / 65535 * 2 - 1;
    const z = 1 - Math.abs(px) - Math.abs(py), k = Math.max(-z, 0);
    const x = px + (px >= 0 ? -k : k), y = py + (py >= 0 ? -k : k), l = Math.hypot(x, y, z);
    pos[3 * i] = x / l; pos[3 * i + 1] = y / l; pos[3 * i + 2] = z / l;
    for (let c = 0; c < 4; c++) col[4 * i + c] = vb[8 * i + 4 + c];
  }
  const tb = bytesOf(S.mesh.triangles_b64), g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 4, true));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(tb.buffer, tb.byteOffset, tb.length / 2), 1));
  return g;
}
const SKY_GLSL = `
float hash13(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
vec3 hash33(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }`;
function nebulaMesh(S) {
  const mat = new THREE.ShaderMaterial({
    uniforms: { uStars: { value: new THREE.Vector4(S.dust_stars.density, S.dust_stars.brightness, 0.001, 1) } },
    vertexShader: `attribute vec4 aCol; varying vec4 vCol; varying vec3 vDir;
      void main() { vCol = aCol; vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec4 uStars; varying vec4 vCol; varying vec3 vDir; ${SKY_GLSL}

  warp_expanded: () => scripted(30, () => { station = 'power'; powerMode = 'warp'; expanded = 'station'; A.plot(); for (let i = 0; i < Math.round(8 / DT); i++) step(); }, 'warp'),
  warp_jumped: () => scripted(30, () => { station = 'power'; powerMode = 'warp'; A.turn(180); A.plot(); A.setSpeed(180); for (let i = 0; i < Math.round(30 / DT); i++) step(); A.jump(); for (let i = 0; i < Math.round(2 / DT); i++) step(); }, 'warp'),
  scene_select: () => { scripted(600); sceneOpen = true; },
  scene_mines: () => scripted(90, () => { station = 'transport'; trTab = 'inv'; placingMine = true; }, 'mines'),
  scene_mines_laid: () => scripted(30, () => { station = 'transport'; trTab = 'inv'; const s = W.player;
    for (const [x, z] of [[-6, -34], [8, -36]]) { A.placeMine(s.x + x, s.z + z); for (let i = 0; i < Math.round(7 / DT); i++) step(); }
    for (let i = 0; i < Math.round(8 / DT); i++) step(); }, 'mines'),
  // Hold the Vorrak, then run: the tow drags it into the rock between them.
  scene_tractor: () => scripted(30, () => { shipTab = 'tractor'; A.tractorHold(); for (let i = 0; i < Math.round(11 / DT); i++) step();
    A.setSpeed(250); for (let i = 0; i < Math.round(8 / DT); i++) step(); }, 'tractor'),
  scene_raid: () => scripted(30, () => { station = 'transport'; trTab = 'hit'; raidSys = 'engines'; raidKind = 'bomb'; raidPick.marines = 2; raidPick.demo = 1; A.raid(); for (let i = 0; i < Math.round(3 / DT); i++) step(); }, 'boarding'),
  scene_board: () => scripted(30, () => { station = 'transport'; trTab = 'capture'; A.board(); for (let i = 0; i < Math.round(2.5 / DT); i++) step(); }, 'boarding'),
  scene_captured: () => scripted(30, () => { station = 'fleet'; A.board(); for (let i = 0; i < Math.round(8 / DT); i++) step(); fleetPick = 'rattlejaw'; }, 'boarding'),
  // The helm pointed at a spot ahead and to the left of the ship, half a second into the turn.
  helm_click: () => scripted(600, () => { const s = W.player, f = fwd(s.h), r = rightOf(s.h); A.helmTo(s.x + f[0] * 12 - r[0] * 14, s.z + f[1] * 12 - r[1] * 14); for (let i = 0; i < 15; i++) step(); }),
  power: () => scripted(600, () => { station = 'power'; }),
  fleet: () => scripted(600, () => { station = 'fleet'; }),
  power_expanded: () => scripted(600, () => { station = 'power'; expanded = 'station'; }),
  ship_expanded: () => scripted(600, () => { expanded = 'ship'; }),
  weapons_expanded: () => scripted(600, () => { expanded = 'weapons'; }),
  map_expanded: () => scripted(600, () => { expanded = 'radar'; }),
  menu: () => scripted(600, () => { menuOpen = true; }),
  reactor: () => scripted(600, () => { station = 'power'; powerMode = 'reactor'; damagedReactor(); }),
  reactor_expanded: () => scripted(600, () => { station = 'power'; powerMode = 'reactor'; expanded = 'station'; damagedReactor(); }),
};
window.MOCKUP_SCENE = scene;
window.MOCKUP_CAM = { camera, controls, renderer, THREE, locked: () => camLock };
// For headless checks of the stand-in battle's rules (tools, not the page's UI).
window.MOCKUP_SIM = { step, A, get W() { return W; }, REACTOR, output, used, cooling, cooldownS, fmtCool, WEAPONS, get HOT() { return HOT; }, capPick, raidPick };
let lastInfo = { triangles: 0, calls: 0 };
window.MOCKUP_INFO = () => lastInfo;
// The rectangles the console registered last frame, for headless checks (no overlaps, sizes).
window.MOCKUP_HITS = () => PREV.map(({ id, x, y, w, h }) => ({ id, x, y, w, h }));
window.MOCKUP_PLAY = () => { frozen = false; };

document.fonts.load('600 20px Antonio').then(() => document.fonts.load('700 20px Antonio')).catch(() => {}).then(() => {
  buildKit(); newWorld();
  const home = el('a', '', 'All Fleet Command mockups (the tracker)'); home.id = 'home'; home.href = 'https://claude.ai/artifact/8VqA9YjhCrgoiY2CGR1Qxu'; home.target = '_blank';
  root.append(renderer.domElement, ui, home);
  wireInput(); wireView(); layout();
  addEventListener('resize', layout);
  requestAnimationFrame((t) => { last = t; frame(t); window.MOCKUP_READY = true; });
});
})();
</script>
</body>
</html>
