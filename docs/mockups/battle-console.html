<script type="application/json" data-src="data/space/starfield.json">{"schema":"starcrew.starfield/1","_status":"Built (2026-10-16): openspec/changes/nebula-skies design 5, docs/mockups/nebula-skies.html. Read by tools/space/nebula_skies.py (the classes and colours), the mockup and sc-core::sky (the engine's stars and streaks).","_doc":"The vector stars drawn over a nebula sky, and how they streak (nebula-skies design 5). Each star is a direction at infinity; every frame it is drawn as a line from where it is on screen now back toward where it was tail_s ago, so a turning view smears the stars into short lines (FreeSpace's way: the star's last position kept, a line drawn to it, its length capped and its brightness dimmed as it grows). A star's class sets its brightness range (the sky file holds each star's own) and its head's size at rest; its colour is a tint. streak: tail_s the seconds of turning a tail shows, max_deg the longest tail (angle), min_px the least line drawn (a star at rest is a point), dim_per_deg the brightness lost per degree of tail (FreeSpace 2's 7,800 per unit) and dim_floor the least kept (FreeSpace 2 kept 75 of 255 over black space; 0.5 here so a streak still reads over a bright cloud), tail_fade the tail end's share of the head's opacity, alpha_min and whiten: a star is alpha-blended (FreeSpace's alpha-blended lines) toward its colour mixed whiten of the way to white, at an opacity of alpha_min + (1 - alpha_min) x its brightness, times the dim, cut_deg_s a turn faster than this is a camera cut (no tail that frame), faint_floor the faint hashed stars' brightness while the tail is at its cap (design 5.5: they fade during a fast turn). motes: patrol-mission 11.4's dust round the eye, drawn by the same streak rule from eye-space points, so moving forward fast shows. Colours sRGB 0-1.","_owner":"2026-10-15: \"and drawing stars and simulating motion blur with gl lines\", \"like old school games\", \"freespace 1 did fake motion blur with vector grap // ===============================================================================================================

// panel title. Another skin (lib/krai.js) gives the same names its own colours.

// The ship's marines aboard are its security teams of up to `team`, each in a room of the ship's deck plan. A team walks
// the corridors at walk_m_s, or is beamed to a room by the internal transporter (one pad charge). A team and a boarding
// squad within engage_m on one deck fight, both held where they are: a volley every volley_s, each side's marines one shot
// each at BOARD.hit_chance (the boarding rule, one implementation), the security chief's aboard added to ours. A team that
// has held its room for ambush_s has an ambush set: its first volley adds ambush_bonus (and the chief's ambush) and the
// boarders get no shots in it. An enemy ship with ai.board beams a squad of up to board_squad marines aboard every
// board_every_s while it can board (in transporter range, the facing toward it down), into a room of its own choosing; the
// squad walks to its goal and, unopposed there, damages the room's system by sabotage_dmg every sabotage_s (ROOM_SYSTEM).

window.MOCKUP_UI = () => ({ station, shipTab, expanded, powerMode, paused, menuOpen, trTab, sceneId, sceneOpen, logOpen, placingMine, placingHet, showShields, showTargetCam, camLock, raidSys, raidKind, raidMount, raidMountOpen, focus, fleetPick, secSel, secMode });
window.MOCKUP_PRESS = (id, button = 0) => { const h = PREV.find((q) => q.id === id); if (!h) return false; const cx = h.x + h.w / 2, cy = h.y + h.h / 2;
  if (h.click) h.click(cx, cy, button); else if (h.drag) { h.drag(cx, cy, true); h.drag(cx, cy, false); } else return false; return true; };
window.MOCKUP_DRAW = () => drawUI();

Promise.all(CON.fonts.map((f) => document.fonts.load(f))).catch(() => {}).then(() => CON.load()).then(() => {
  buildKit(); newWorld();
  const home = el('a', '', 'All Fleet Command mockups (the tracker)'); home.id = 'home'; home.href = 'https://claude.ai/artifact/8VqA9YjhCrgoiY2CGR1Qxu'; home.target = '_blank'; css(home, `color:${CON.link};font-family:${CON.family};`);
  root.append(renderer.domElement, IR.domElement, ui, home);
  wireInput(); wireView(); layout();
  addEventListener('resize', layout);
  requestAnimationFrame((t) => { last = t; frame(t); window.MOCKUP_READY = true; });
});
})();
